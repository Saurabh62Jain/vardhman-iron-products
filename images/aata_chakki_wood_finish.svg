<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%" style="background:#091122; font-family:'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="woodFinish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="30%" stop-color="#a16207"/>
      <stop offset="60%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="ssTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="chakkiShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#091122" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="800" rx="260" ry="30" fill="url(#chakkiShadow)"/>

  <!-- Castor Wheels -->
  <circle cx="270" cy="780" r="14" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  <circle cx="530" cy="780" r="14" fill="#1e293b" stroke="#64748b" stroke-width="3"/>

  <!-- Main Body Cabinet -->
  <rect x="230" y="160" width="340" height="610" rx="16" fill="url(#woodFinish)" stroke="#d97706" stroke-width="2"/>

  <!-- Stainless Steel Top & Hopper Cover -->
  <rect x="215" y="130" width="370" height="40" rx="8" fill="url(#ssTrim)" stroke="#64748b" stroke-width="1.5"/>
  <!-- Top Handle -->
  <rect x="330" y="105" width="140" height="28" rx="14" fill="#334155" stroke="url(#ssTrim)" stroke-width="2"/>
  
  <!-- Front Designer Acrylic Inlay -->
  <rect x="255" y="190" width="290" height="550" rx="10" fill="#2d1500" stroke="#b45309" stroke-width="1"/>
  <!-- Floral/Modern Wave Art line -->
  <path d="M 270 240 Q 400 320 530 240 Q 400 480 270 560" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
  <path d="M 270 300 Q 400 380 530 300" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>

  <!-- Digital Smart Display -->
  <rect x="300" y="210" width="200" height="55" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="325" cy="237" r="6" fill="#10b981"/>
  <text x="345" y="233" font-size="11" font-weight="bold" fill="#f59e0b">AUTO SENSING ON</text>
  <text x="345" y="250" font-size="9" fill="#94a3b8">100% PURE COPPER MOTOR</text>

  <!-- Stainless Steel Door Handle -->
  <rect x="500" y="320" width="16" height="150" rx="8" fill="url(#ssTrim)" stroke="#475569" stroke-width="1"/>
  <circle cx="508" cy="335" r="4" fill="#0284c7"/><circle cx="508" cy="455" r="4" fill="#0284c7"/>

  <!-- Flour Collection Window (Inspection View) -->
  <rect x="290" y="520" width="220" height="180" rx="8" fill="#180e06" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="400" cy="590" r="45" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="595" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">आटा संग्रहण पात्र</text>
  <text x="400" y="615" font-size="10" fill="#cbd5e1" text-anchor="middle">SS 304 (4.5 KG)</text>

  <!-- ================= PROMINENT VARDHMAN BRAND STICKER ON CHAKKI ================= -->
  <g transform="translate(320, 275)">
    <rect x="0" y="0" width="160" height="52" rx="6" fill="#ca8a04" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="3" y="3" width="154" height="46" rx="4" fill="#991b1b" stroke="#fef08a" stroke-width="0.8"/>
    <text x="80" y="14" font-size="6" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">★ 100% ORIGINAL FACTORY ★</text>
    <text x="80" y="32" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">वर्धमान आटा मेकर</text>
    <text x="80" y="44" font-size="7" font-weight="bold" fill="#fef08a" text-anchor="middle">बीना (म.प्र.) • 9425424932</text>
  </g>

  <!-- Tag -->
  <g transform="translate(400, 845)">
    <rect x="-190" y="-12" width="380" height="30" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1"/>
    <text x="0" y="7" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">प्रीमियम वुडन फिनिश घरेलू ऑटोमैटिक आटा चक्की</text>
  </g>
</svg>
