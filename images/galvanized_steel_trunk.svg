<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%" style="background:#091122; font-family:'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="trunkGalv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="brassHardware" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="trunkShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#091122" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="560" rx="330" ry="40" fill="url(#trunkShadow)"/>

  <!-- Isometric Trunk Body -->
  <!-- Bottom Box Body -->
  <polygon points="120,320 620,320 680,240 180,240" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <polygon points="120,320 620,320 620,520 120,520" fill="url(#trunkGalv)" stroke="#334155" stroke-width="2"/>
  <polygon points="620,320 680,240 680,440 620,520" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Trunk Curved / Beveled Lid -->
  <polygon points="115,320 625,320 685,240 175,240" fill="none" stroke="#64748b" stroke-width="2"/>
  <!-- Lid Top Slope -->
  <polygon points="115,280 625,280 685,200 175,200" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <polygon points="115,320 625,320 625,280 115,280" fill="url(#trunkGalv)" stroke="#475569" stroke-width="1.5"/>
  <polygon points="625,320 685,240 685,200 625,280" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Reinforcing Embossed Ribs on Front Face -->
  <line x1="160" y1="360" x2="580" y2="360" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="420" x2="580" y2="420" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="480" x2="580" y2="480" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

  <!-- Heavy Brass Corner Protectors -->
  <!-- Top Corners -->
  <polygon points="115,280 145,280 145,300 130,300 130,320 115,320" fill="url(#brassHardware)"/>
  <polygon points="625,280 595,280 595,300 610,300 610,320 625,320" fill="url(#brassHardware)"/>
  <!-- Bottom Corners -->
  <polygon points="120,490 145,490 145,520 120,520" fill="url(#brassHardware)"/>
  <polygon points="620,490 595,490 595,520 620,520" fill="url(#brassHardware)"/>

  <!-- Heavy Duty Front Brass Hasps & Latches (Kundi / Taala) -->
  <g transform="translate(370, 275)">
    <!-- Central Padlock Clasp -->
    <rect x="0" y="0" width="60" height="75" rx="6" fill="url(#brassHardware)" stroke="#713f12" stroke-width="1.5"/>
    <circle cx="30" cy="25" r="8" fill="#1e293b"/>
    <rect x="22" y="45" width="16" height="20" rx="3" fill="#1e293b"/>
    <path d="M 20 65 L 40 65 L 30 75 Z" fill="#ca8a04"/>
  </g>
  <!-- Side Latches -->
  <g transform="translate(220, 290)">
    <rect x="0" y="0" width="35" height="50" rx="4" fill="url(#brassHardware)" stroke="#713f12" stroke-width="1"/>
  </g>
  <g transform="translate(545, 290)">
    <rect x="0" y="0" width="35" height="50" rx="4" fill="url(#brassHardware)" stroke="#713f12" stroke-width="1"/>
  </g>

  <!-- Sturdy Side Handles (D-Rings) -->
  <g transform="translate(130, 410)">
    <rect x="-10" y="-12" width="20" height="24" rx="3" fill="url(#brassHardware)"/>
    <path d="M -10 0 C -25 0 -25 30 -10 30" fill="none" stroke="url(#brassHardware)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(650, 360)">
    <rect x="-10" y="-12" width="20" height="24" rx="3" fill="url(#brassHardware)"/>
    <path d="M 0 0 C 15 0 15 25 0 25" fill="none" stroke="url(#brassHardware)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ================= PROMINENT VARDHMAN BRAND STICKER ON TRUNK ================= -->
  <g transform="translate(400, 395)">
    <rect x="-90" y="-28" width="180" height="56" rx="6" fill="#ca8a04" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="-86" y="-24" width="172" height="48" rx="4" fill="#991b1b" stroke="#fef08a" stroke-width="0.8"/>
    <text x="0" y="-12" font-size="6" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">★ ORIGINAL FACTORY PRODUCT ★</text>
    <text x="0" y="8" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">वर्धमान</text>
    <text x="0" y="20" font-size="7" font-weight="bold" fill="#fef08a" text-anchor="middle">बीना (म.प्र.) • मो. 9425424932</text>
  </g>

  <!-- Footer Tag -->
  <g transform="translate(400, 590)">
    <rect x="-210" y="-12" width="420" height="30" rx="4" fill="#0f172a" stroke="#ca8a04" stroke-width="1"/>
    <text x="0" y="7" font-size="12" font-weight="bold" fill="#fde047" text-anchor="middle">हेवी गेज जी.आई. शीट स्टोरेज संदूक / बक्सा (चूहा व सीलन-मुक्त)</text>
  </g>
</svg>
