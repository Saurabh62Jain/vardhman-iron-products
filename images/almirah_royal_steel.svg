<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%" style="background:#0b1329; font-family:'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="almirahMaroon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#580816"/>
      <stop offset="40%" stop-color="#8a0c22"/>
      <stop offset="70%" stop-color="#aa1831"/>
      <stop offset="100%" stop-color="#4e0512"/>
    </linearGradient>
    <linearGradient id="chromeBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="mirrorGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0b1329" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Studio Floor Glow & Shadow -->
  <ellipse cx="400" cy="810" rx="280" ry="35" fill="url(#floorShadow)"/>

  <!-- Almirah Base Legs -->
  <rect x="200" y="760" width="35" height="35" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="565" y="760" width="35" height="35" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>

  <!-- Main Steel Body Frame -->
  <rect x="180" y="80" width="440" height="690" rx="8" fill="url(#almirahMaroon)" stroke="#f59e0b" stroke-width="2"/>
  
  <!-- Crown Header -->
  <polygon points="175,80 625,80 615,60 185,60" fill="#3a040d" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="280" y="66" width="240" height="18" rx="2" fill="#200207" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="79" font-size="10" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="2">VARDHMAN STEEL ROYAL</text>

  <!-- Left Door (Plain Heavy Gauge Steel) -->
  <rect x="195" y="95" width="200" height="660" rx="4" fill="url(#almirahMaroon)" stroke="#4e0512" stroke-width="2"/>
  <rect x="210" y="115" width="170" height="290" rx="4" fill="none" stroke="#780b1e" stroke-width="3"/>
  <rect x="210" y="430" width="170" height="305" rx="4" fill="none" stroke="#780b1e" stroke-width="3"/>
  
  <!-- Left Door Brass Ornamentation -->
  <circle cx="295" cy="260" r="28" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="295" cy="580" r="28" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Right Door with Dressing Mirror -->
  <rect x="405" y="95" width="200" height="660" rx="4" fill="url(#almirahMaroon)" stroke="#4e0512" stroke-width="2"/>
  
  <!-- Full Length Mirror -->
  <rect x="420" y="115" width="170" height="420" rx="4" fill="url(#chromeBezel)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="426" y="121" width="158" height="408" rx="3" fill="url(#mirrorGlass)"/>
  <!-- Mirror Glare / Sheen Line -->
  <polygon points="435,125 470,125 435,260" fill="#ffffff" fill-opacity="0.35"/>
  <polygon points="435,310 570,125 580,125 435,360" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Bottom Drawer on Right Door -->
  <rect x="420" y="555" width="170" height="180" rx="4" fill="#3a040d" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="430" y="565" width="150" height="160" rx="3" fill="none" stroke="#780b1e" stroke-width="2"/>
  <!-- Drawer Handle -->
  <rect x="480" y="635" width="50" height="12" rx="6" fill="url(#chromeBezel)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Center Double-Locking Mechanism & Brass Handle -->
  <rect x="390" y="390" width="20" height="80" rx="4" fill="url(#chromeBezel)" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="400" cy="415" r="5" fill="#f59e0b"/>
  <!-- Turn Keyhole -->
  <path d="M 398 440 L 402 440 L 401 448 L 399 448 Z" fill="#000000"/>
  <circle cx="400" cy="438" r="3" fill="#000000"/>

  <!-- ================= PROMINENT VARDHMAN BRAND STICKER ON ALMIRAH ================= -->
  <g transform="translate(230, 280)">
    <rect x="0" y="0" width="130" height="60" rx="6" fill="#ca8a04" stroke="#fef08a" stroke-width="1.2"/>
    <rect x="3" y="3" width="124" height="54" rx="4" fill="#991b1b" stroke="#fef08a" stroke-width="0.8"/>
    <text x="65" y="16" font-size="6" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">★ ORIGINAL FACTORY SEAL ★</text>
    <text x="65" y="38" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">वर्धमान</text>
    <text x="65" y="50" font-size="7" font-weight="bold" fill="#fef08a" text-anchor="middle">बीना (म.प्र.) • 9425424932</text>
  </g>

  <!-- Vardhman Premium Badge -->
  <g transform="translate(400, 840)">
    <rect x="-180" y="-12" width="360" height="30" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="7" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="middle">वर्धमान हेवी गेज स्टील अलमारी • सीक्रेट लॉकर सहित</text>
  </g>
</svg>
