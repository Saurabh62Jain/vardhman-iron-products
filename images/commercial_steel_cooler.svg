<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%" style="background:#091122; font-family:'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="commCoolerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="commSteelShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="commShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#091122" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="830" rx="330" ry="35" fill="url(#commShadow)"/>

  <!-- Heavy Duty Trolley Wheels -->
  <g transform="translate(180, 800)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="#f59e0b"/>
  </g>
  <g transform="translate(620, 800)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="#f59e0b"/>
  </g>

  <!-- Heavy Square Trolley Frame -->
  <rect x="140" y="780" width="520" height="24" rx="4" fill="#1e293b" stroke="#0284c7" stroke-width="2"/>

  <!-- 150L Heavy GI Bottom Water Tank -->
  <rect x="150" y="600" width="500" height="180" rx="6" fill="url(#commCoolerGrad)" stroke="#475569" stroke-width="2"/>
  <!-- Tank Embossed Lines -->
  <line x1="170" y1="650" x2="630" y2="650" stroke="#334155" stroke-width="4"/>
  <line x1="170" y1="710" x2="630" y2="710" stroke="#334155" stroke-width="4"/>
  <!-- Water Level Tube -->
  <rect x="600" y="625" width="20" height="130" rx="4" fill="#0284c7" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="610" cy="720" r="5" fill="#38bdf8"/>

  <!-- Main Cooler Upper Chamber -->
  <rect x="160" y="140" width="480" height="460" rx="6" fill="url(#commSteelShine)" stroke="#334155" stroke-width="2"/>

  <!-- Top Canopy with Water Distribution System -->
  <polygon points="145,140 655,140 640,100 160,100" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <rect x="250" y="110" width="300" height="20" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="400" y="124" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="2">VARDHMAN COMMERCIAL 24" EXHAUST</text>

  <!-- Giant 24" Circular Fan Shroud -->
  <circle cx="400" cy="370" r="180" fill="#0f172a" stroke="#0284c7" stroke-width="5"/>
  <circle cx="400" cy="370" r="168" fill="#020617" stroke="#38bdf8" stroke-width="2"/>

  <!-- Protective Fan Wire Guard Mesh -->
  <circle cx="400" cy="370" r="130" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="400" cy="370" r="90" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="400" cy="370" r="50" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- 24-Inch Aerodynamic 3-Blade Metal Exhaust Fan -->
  <g transform="translate(400, 370)">
    <circle cx="0" cy="0" r="30" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
    <!-- Blade 1 -->
    <path d="M 0 -25 C -45 -70 -35 -140 0 -155 C 35 -140 45 -70 0 -25 Z" fill="url(#commSteelShine)" stroke="#475569" stroke-width="1.5"/>
    <!-- Blade 2 -->
    <path d="M 22 13 C 70 30 135 70 135 110 C 105 130 50 85 22 13 Z" fill="url(#commSteelShine)" stroke="#475569" stroke-width="1.5"/>
    <!-- Blade 3 -->
    <path d="M -22 13 C -70 30 -135 70 -135 110 C -105 130 -50 85 -22 13 Z" fill="url(#commSteelShine)" stroke="#475569" stroke-width="1.5"/>
    <!-- Center Red Hub -->
    <circle cx="0" cy="0" r="12" fill="#dc2626"/>
  </g>

  <!-- Heavy Rotary Switchboard on Left Side of Tank -->
  <rect x="180" y="630" width="90" height="120" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="225" cy="660" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="225" y="688" font-size="8" fill="#94a3b8" text-anchor="middle" font-weight="bold">FAN SPEED</text>
  <circle cx="225" cy="710" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="225" y="734" font-size="8" fill="#94a3b8" text-anchor="middle" font-weight="bold">PUMP</text>

  <!-- ================= THE VARDHMAN BRAND STICKER ON THE FRONT TANK ================= -->
  <g transform="translate(300, 645)">
    <!-- Golden Border Plate -->
    <rect x="0" y="0" width="220" height="90" rx="8" fill="#ca8a04" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Red Inner Badge -->
    <rect x="4" y="4" width="212" height="82" rx="6" fill="#991b1b" stroke="#fef08a" stroke-width="1"/>
    <!-- Brand Sticker Text -->
    <text x="110" y="22" font-size="7" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">★ ORIGINAL FACTORY PRODUCT ★</text>
    <text x="110" y="52" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">वर्धमान</text>
    <text x="110" y="66" font-size="9" font-weight="bold" fill="#fef08a" text-anchor="middle">VARDHMAN IRON PRODUCTS</text>
    <text x="110" y="78" font-size="7" fill="#ffffff" text-anchor="middle">बीना (म.प्र.) • 9425424932</text>
  </g>

  <!-- Bottom Tag -->
  <g transform="translate(400, 860)">
    <rect x="-210" y="-12" width="420" height="30" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="0" y="7" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">वर्धमान 24" इंडस्ट्रियल हैवी-ड्यूटी कूलर (150 लीटर टैंक)</text>
  </g>
</svg>
