<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="100%" height="100%" style="background:#091122; font-family:'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="galvSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="rackFloor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#091122" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="400" cy="820" rx="320" ry="35" fill="url(#rackFloor)"/>

  <!-- Left Slotted Angle Pillar -->
  <g transform="translate(180, 100)">
    <rect x="0" y="0" width="30" height="710" fill="url(#galvSteel)" stroke="#334155" stroke-width="1.5"/>
    <!-- Perforated Slots on Angle -->
    <g fill="#0f172a">
      <rect x="8" y="20" width="14" height="6" rx="2"/><rect x="8" y="45" width="14" height="6" rx="2"/>
      <rect x="8" y="70" width="14" height="6" rx="2"/><rect x="8" y="95" width="14" height="6" rx="2"/>
      <rect x="8" y="120" width="14" height="6" rx="2"/><rect x="8" y="145" width="14" height="6" rx="2"/>
      <rect x="8" y="170" width="14" height="6" rx="2"/><rect x="8" y="195" width="14" height="6" rx="2"/>
      <rect x="8" y="220" width="14" height="6" rx="2"/><rect x="8" y="245" width="14" height="6" rx="2"/>
      <rect x="8" y="270" width="14" height="6" rx="2"/><rect x="8" y="295" width="14" height="6" rx="2"/>
      <rect x="8" y="320" width="14" height="6" rx="2"/><rect x="8" y="345" width="14" height="6" rx="2"/>
      <rect x="8" y="370" width="14" height="6" rx="2"/><rect x="8" y="395" width="14" height="6" rx="2"/>
      <rect x="8" y="420" width="14" height="6" rx="2"/><rect x="8" y="445" width="14" height="6" rx="2"/>
      <rect x="8" y="470" width="14" height="6" rx="2"/><rect x="8" y="495" width="14" height="6" rx="2"/>
      <rect x="8" y="520" width="14" height="6" rx="2"/><rect x="8" y="545" width="14" height="6" rx="2"/>
      <rect x="8" y="570" width="14" height="6" rx="2"/><rect x="8" y="595" width="14" height="6" rx="2"/>
      <rect x="8" y="620" width="14" height="6" rx="2"/><rect x="8" y="645" width="14" height="6" rx="2"/>
      <rect x="8" y="670" width="14" height="6" rx="2"/><rect x="8" y="695" width="14" height="6" rx="2"/>
    </g>
  </g>

  <!-- Right Slotted Angle Pillar -->
  <g transform="translate(590, 100)">
    <rect x="0" y="0" width="30" height="710" fill="url(#galvSteel)" stroke="#334155" stroke-width="1.5"/>
    <g fill="#0f172a">
      <rect x="8" y="20" width="14" height="6" rx="2"/><rect x="8" y="45" width="14" height="6" rx="2"/>
      <rect x="8" y="70" width="14" height="6" rx="2"/><rect x="8" y="95" width="14" height="6" rx="2"/>
      <rect x="8" y="120" width="14" height="6" rx="2"/><rect x="8" y="145" width="14" height="6" rx="2"/>
      <rect x="8" y="170" width="14" height="6" rx="2"/><rect x="8" y="195" width="14" height="6" rx="2"/>
      <rect x="8" y="220" width="14" height="6" rx="2"/><rect x="8" y="245" width="14" height="6" rx="2"/>
      <rect x="8" y="270" width="14" height="6" rx="2"/><rect x="8" y="295" width="14" height="6" rx="2"/>
      <rect x="8" y="320" width="14" height="6" rx="2"/><rect x="8" y="345" width="14" height="6" rx="2"/>
      <rect x="8" y="370" width="14" height="6" rx="2"/><rect x="8" y="395" width="14" height="6" rx="2"/>
      <rect x="8" y="420" width="14" height="6" rx="2"/><rect x="8" y="445" width="14" height="6" rx="2"/>
      <rect x="8" y="470" width="14" height="6" rx="2"/><rect x="8" y="495" width="14" height="6" rx="2"/>
      <rect x="8" y="520" width="14" height="6" rx="2"/><rect x="8" y="545" width="14" height="6" rx="2"/>
      <rect x="8" y="570" width="14" height="6" rx="2"/><rect x="8" y="595" width="14" height="6" rx="2"/>
      <rect x="8" y="620" width="14" height="6" rx="2"/><rect x="8" y="645" width="14" height="6" rx="2"/>
      <rect x="8" y="670" width="14" height="6" rx="2"/><rect x="8" y="695" width="14" height="6" rx="2"/>
    </g>
  </g>

  <!-- Rear Pillars (Isometric Depth) -->
  <rect x="250" y="80" width="22" height="710" fill="#334155" opacity="0.6"/>
  <rect x="528" y="80" width="22" height="710" fill="#334155" opacity="0.6"/>

  <!-- 5 Shelves (Trays) -->
  <!-- Shelf 1 (Top) -->
  <g transform="translate(195, 120)">
    <polygon points="0,20 380,20 405,0 25,0" fill="url(#shelfGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="20" width="380" height="22" fill="url(#galvSteel)" stroke="#334155" stroke-width="1"/>
    <!-- Bolt Connectors -->
    <circle cx="5" cy="30" r="4" fill="#0284c7"/><circle cx="375" cy="30" r="4" fill="#0284c7"/>
  </g>

  <!-- Shelf 2 -->
  <g transform="translate(195, 270)">
    <polygon points="0,20 380,20 405,0 25,0" fill="url(#shelfGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="20" width="380" height="22" fill="url(#galvSteel)" stroke="#334155" stroke-width="1"/>
    <circle cx="5" cy="30" r="4" fill="#0284c7"/><circle cx="375" cy="30" r="4" fill="#0284c7"/>
  </g>

  <!-- Shelf 3 with Vardhman Brand Sticker -->
  <g transform="translate(195, 420)">
    <polygon points="0,20 380,20 405,0 25,0" fill="url(#shelfGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="20" width="380" height="22" fill="url(#galvSteel)" stroke="#334155" stroke-width="1"/>
    <circle cx="5" cy="30" r="4" fill="#0284c7"/><circle cx="375" cy="30" r="4" fill="#0284c7"/>
    <!-- Vardhman Metallic Branding Strip -->
    <rect x="130" y="21" width="120" height="20" rx="3" fill="#991b1b" stroke="#fef08a" stroke-width="1"/>
    <text x="190" y="35" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">वर्धमान VARDHMAN</text>
  </g>

  <!-- Shelf 4 -->
  <g transform="translate(195, 570)">
    <polygon points="0,20 380,20 405,0 25,0" fill="url(#shelfGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="20" width="380" height="22" fill="url(#galvSteel)" stroke="#334155" stroke-width="1"/>
    <circle cx="5" cy="30" r="4" fill="#0284c7"/><circle cx="375" cy="30" r="4" fill="#0284c7"/>
  </g>

  <!-- Shelf 5 (Bottom) -->
  <g transform="translate(195, 720)">
    <polygon points="0,20 380,20 405,0 25,0" fill="url(#shelfGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="20" width="380" height="22" fill="url(#galvSteel)" stroke="#334155" stroke-width="1"/>
    <circle cx="5" cy="30" r="4" fill="#0284c7"/><circle cx="375" cy="30" r="4" fill="#0284c7"/>
  </g>

  <!-- Corner Bracing Triangles (L-plates) -->
  <polygon points="210,120 235,120 210,145" fill="#0284c7"/>
  <polygon points="560,120 585,120 585,145" fill="#0284c7"/>
  <polygon points="210,720 235,720 210,745" fill="#0284c7"/>
  <polygon points="560,720 585,720 585,745" fill="#0284c7"/>

  <!-- Footer Tag -->
  <g transform="translate(400, 850)">
    <rect x="-190" y="-12" width="380" height="30" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="0" y="7" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">वर्धमान हेवी-ड्यूटी स्लॉटेड एंगल स्टील रैक (एडजस्टेबल)</text>
  </g>
</svg>
